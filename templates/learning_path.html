function generatePath() {
  const career = document.getElementById("career").value;
  const container = document.getElementById("path");
  container.innerHTML = "";

  if (paths[career]) {
    const data = paths[career];
    for (const section in data) {
      const secDiv = document.createElement("div");
      secDiv.className = "section";
      const h3 = document.createElement("h3");
      h3.textContent = section;
      secDiv.appendChild(h3);

      const ul = document.createElement("ul");
      data[section].forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = item;
        ul.appendChild(li);
      });
      secDiv.appendChild(ul);
      container.appendChild(secDiv);
    }
  } else {
    container.innerHTML = "<p style='color:red;'>No learning path found for this career. Please select from the list.</p>";
  }
}
