<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ topic.name }} - Subtopics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#667eea,#764ba2,#ff6a88,#ffb199);
background-size:400% 400%;
animation:gradientBG 10s ease infinite;
color:white;
}

/* animated background */

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
width:420px;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
box-shadow:0 10px 40px rgba(0,0,0,0.4);
text-align:center;
animation:fadeIn 1s ease;
}

h1{
margin-bottom:30px;
font-size:28px;
font-weight:700;
letter-spacing:1px;
}

ul{
list-style:none;
}

li{
margin:15px 0;
opacity:0;
transform:translateY(20px);
animation:slideUp 0.6s forwards;
}

li:nth-child(1){animation-delay:0.1s;}
li:nth-child(2){animation-delay:0.2s;}
li:nth-child(3){animation-delay:0.3s;}
li:nth-child(4){animation-delay:0.4s;}
li:nth-child(5){animation-delay:0.5s;}
li:nth-child(6){animation-delay:0.6s;}
li:nth-child(7){animation-delay:0.7s;}
li:nth-child(8){animation-delay:0.8s;}
li:nth-child(9){animation-delay:0.9s;}
li:nth-child(10){animation-delay:1s;}

a{
display:block;
padding:15px;
border-radius:12px;
text-decoration:none;
color:white;
font-weight:500;
background:rgba(255,255,255,0.2);
transition:all 0.3s ease;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

a:hover{
background:rgba(255,255,255,0.35);
transform:translateY(-6px) scale(1.03);
box-shadow:0 12px 30px rgba(0,0,0,0.5);
}

/* animations */

@keyframes fadeIn{
from{
opacity:0;
transform:scale(0.9);
}
to{
opacity:1;
transform:scale(1);
}
}

@keyframes slideUp{
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="container">

<h1>{{ topic.name }} Subtopics</h1>

<ul>
{% for sub in subtopics %}
<li>
<a href="/quiz/{{ sub.id }}/questions/">
{{ sub.name }}
</a>
</li>
{% endfor %}
</ul>

</div>

<script>

const links=document.querySelectorAll("a");

links.forEach(link=>{
link.addEventListener("mouseenter",()=>{
link.style.boxShadow="0 0 20px rgba(255,255,255,0.7)";
});

link.addEventListener("mouseleave",()=>{
link.style.boxShadow="0 5px 15px rgba(0,0,0,0.2)";
});
});

</script>

</body>
</html>
