{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - AI Career Coach</title>
  <link rel="stylesheet" href="{% static 'styles/style.css' %}">
    <style>/* General Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

/* Body Styling */
body {
url("../images/resumebg.jpg") no-repeat center center / cover;
  background: linear-gradient(135deg, #0077b6, #00b4d8, #90e0ef);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Container */
.signin-container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Card */
.signin-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  width: 100%;
  max-width: 400px;
  padding: 40px 30px;
  text-align: center;
  animation: fadeIn 0.8s ease-in-out;
}

/* Heading */
.signin-card h2 {
  color: #0077b6;
  font-weight: 600;
  margin-bottom: 25px;
}

/* Form Groups */
.form-group {
  text-align: left;
  margin-bottom: 20px;
}

/* Labels */
label {
  display: block;
  font-weight: 500;
  margin-bottom: 8px;
  color: #333;
}

/* Input Fields */
input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
  transition: border-color 0.3s ease;
}

input[type="text"]:focus,
input[type="password"]:focus {
  border-color: #0077b6;
  outline: none;
  box-shadow: 0 0 5px rgba(0, 119, 182, 0.3);
}

/* Button */
.btn {
  width: 100%;
  background-color: #0077b6;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.2s;
}

.btn:hover {
  background-color: #005f87;
  transform: translateY(-2px);
}

/* Footer */
.form-footer {
  margin-top: 20px;
}

.form-footer h4 {
  font-size: 14px;
  font-weight: 400;
  color: #333;
}

.form-footer a {
  color: #0077b6;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s ease;
}

.form-footer a:hover {
  color: #005f87;
  text-decoration: underline;
}

/* Animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive */
@media (max-width: 480px) {
  .signin-card {
    padding: 30px 20px;
  }

  .signin-card h2 {
    font-size: 1.5rem;
  }
}
</style>
</head>
<body>

  <div class="signin-container">
    <div class="signin-card">
      <h2>Sign In</h2>
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" name="username" id="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
          <button type="submit"
        class="btn btn-primary"
        formaction="{% url 'dashboard' %}">
  Sign In
</button>

        </div>
        <div class="form-footer">
          <h4>If not register ? <a href="{% url 'register' %}">Register Here</a></h4>
        </div>
      </form>
    </div>
  </div>

<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
