{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Choose Resume Template</title>
  <style>
    .template-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 50px;
    }
    .template-option {
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      width: 220px;
      transition: 0.3s;
      background: #fff;
    }
    .template-option:hover {
      transform: scale(1.05);
      border-color: #007bff;
    }
    img {
      width: 200px;
      height: 250px;
      border-radius: 5px;
    }
    .select-btn {
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align:center;">Choose Your Resume Template</h1>
    <form method="POST">
      {% csrf_token %}
      <div class="template-container">
        <label class="template-option">
          <img src="{% static 'images/template1_preview.png' %}" alt="Template 1">
          <div>
            <input type="radio" name="template" value="template1" required> Template 1
          </div>
        </label>
        <label class="template-option">
          <img src="{% static 'images/template2_preview.png' %}" alt="Template 2">
          <div>
            <input type="radio" name="template" value="template2"> Template 2
          </div>
        </label>
        <label class="template-option">
          <img src="{% static 'images/template3_preview.png' %}" alt="Template 3">
          <div>
            <input type="radio" name="template" value="template3"> Template 3
          </div>
        </label>
        <label class="template-option">
          <img src="{% static 'images/template4_preview.png' %}" alt="Template 4">
          <div>
            <input type="radio" name="template" value="template4"> Template 4
          </div>
        </label>
      </div>
      <div style="text-align:center; margin-top:30px;">
        <button type="submit" class="select-btn">Preview Selected Template</button>
      </div>
    </form>
  </div>
</body>
</html>
